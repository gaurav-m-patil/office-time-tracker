<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Chronometer Dial -->
  <g filter="url(#drop)">
    <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
    <!-- Active Progress Arc -->
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#accentGrad)" stroke-width="12"
            stroke-dasharray="1106" stroke-dashoffset="320" stroke-linecap="round"
            transform="rotate(-90 256 256)" filter="url(#glow)"/>
    
    <!-- Dial Markers -->
    <line x1="256" y1="100" x2="256" y2="116" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round"/>
    <line x1="412" y1="256" x2="396" y2="256" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="412" x2="256" y2="396" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="256" x2="116" y2="256" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Clock Hands (Pointing to 09:15) -->
    <line x1="256" y1="256" x2="256" y2="150" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="330" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="16" fill="#ffffff"/>
    <circle cx="256" cy="256" r="8" fill="#4f46e5"/>
    
    <!-- Subtle Punch Flash Marker -->
    <circle cx="330" cy="256" r="6" fill="#38bdf8" filter="url(#glow)"/>
  </g>
</svg>
