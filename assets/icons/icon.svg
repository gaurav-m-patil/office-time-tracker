<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Midnight Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Bezel Subtle Border Gradient -->
    <linearGradient id="bezelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="50%" stop-color="rgba(99,102,241,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>

    <!-- Electric Indigo-Cyan Accent Gradient -->
    <linearGradient id="chronoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- 7-8h Compliance Gauge Gradient (Emerald to Cyan) -->
    <linearGradient id="complianceArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Intense Center Glow Filter -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>

    <!-- Card Shadow Filter -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Squircle (Apple iOS 115px radius) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="url(#bezelBorder)" stroke-width="2"/>

  <!-- Radial Backdrop Ambient Sheen -->
  <radialGradient id="ambientSheen" cx="50%" cy="32%" r="65%">
    <stop offset="0%" stop-color="rgba(99, 102, 241, 0.22)"/>
    <stop offset="60%" stop-color="rgba(56, 189, 248, 0.04)"/>
    <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
  </radialGradient>
  <rect width="512" height="512" rx="116" fill="url(#ambientSheen)"/>

  <!-- Main Chronometer Core -->
  <g filter="url(#cardShadow)">
    <!-- Outer Bezel Ring -->
    <circle cx="256" cy="256" r="182" fill="#0b1120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>
    <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>

    <!-- Track Background Ring -->
    <circle cx="256" cy="256" r="156" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="10"/>

    <!-- 7-8h Precision Compliance Arc (Active Glowing Segment) -->
    <circle cx="256" cy="256" r="156" fill="none" stroke="url(#complianceArcGrad)" stroke-width="14"
            stroke-dasharray="980" stroke-dashoffset="260" stroke-linecap="round"
            transform="rotate(-90 256 256)" filter="url(#neonGlow)"/>

    <!-- Inner Dial Glass Plate -->
    <circle cx="256" cy="256" r="132" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2"/>

    <!-- Radial Hour Markers -->
    <!-- 12 O'Clock -->
    <rect x="253" y="132" width="6" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <!-- 3 O'Clock -->
    <rect x="368" y="253" width="18" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>
    <!-- 6 O'Clock -->
    <rect x="253" y="362" width="6" height="18" rx="3" fill="rgba(255,255,255,0.7)"/>
    <!-- 9 O'Clock -->
    <rect x="126" y="253" width="18" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>

    <!-- Minor Ticks -->
    <circle cx="316" cy="152" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="360" cy="196" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="360" cy="316" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="316" cy="360" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="196" cy="360" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="152" cy="316" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="152" cy="196" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="196" cy="152" r="3" fill="rgba(255,255,255,0.4)"/>

    <!-- Geometric Monogram TT Center Motif -->
    <path d="M 206 200 L 306 200 M 256 200 L 256 312" stroke="rgba(255,255,255,0.08)" stroke-width="26" stroke-linecap="round"/>

    <!-- Precision Clock Hands (Targeting Peak 08:15 Performance) -->
    <!-- Hour Hand -->
    <line x1="256" y1="256" x2="256" y2="162" stroke="#ffffff" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
    <!-- Minute Hand (Electric Cyan) -->
    <line x1="256" y1="256" x2="340" y2="256" stroke="url(#chronoAccent)" stroke-width="9" stroke-linecap="round" filter="url(#neonGlow)"/>
    <!-- Active Ticker Second Hand (Emerald Pulse Needle) -->
    <line x1="256" y1="280" x2="256" y2="140" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Pivot Hub (Jewel Bearing Effect) -->
    <circle cx="256" cy="256" r="18" fill="#1e293b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="256" cy="256" r="9" fill="#6366f1"/>
    <circle cx="256" cy="256" r="4" fill="#38bdf8"/>

    <!-- Emerald Pulse Dot at 08:15 Target Point -->
    <circle cx="340" cy="256" r="7" fill="#10b981" filter="url(#intenseGlow)"/>
    <circle cx="340" cy="256" r="3.5" fill="#ffffff"/>
  </g>
</svg>
